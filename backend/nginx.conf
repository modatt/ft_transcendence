# backend/nginx.conf

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define the upstream Django server
    upstream django {
        server web:8000;
    }

    server {
        listen 80:80; // modat edited to work on my machine
        server_name RemoLab;

        # Maximum upload size (adjust as needed for your 3D files/PDFs)
        client_max_body_size 50M;

        # 1. Serve Media Files (Uploaded files)
        location /media/ {
            alias /var/www/media/;
        }

        # 2. Serve Static Files (CSS, JS, Images)
        location /static/ {
            alias /var/www/static/;
        }

        # 3. WebSocket Routing (Crucial for Django Channels)
        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400; # Keep WS connection alive
        }

        # 4. Proxy all other requests to Django
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
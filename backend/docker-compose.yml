services:
  db:
    image: postgres:16-bookworm
    container_name: remolab_db
    restart: always
    environment:
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - db_name
      - db_user
      - db_password
    networks:
      - backend_net
    healthcheck:
      # Check readiness using the actual secret credentials
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d $$(cat /run/secrets/db_name)"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: makerspace_redis
    restart: always
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: ./RemoLab
      dockerfile: Dockerfile
    container_name: makerspace_web
    restart: always
    command:
    volumes:
     - ./MakerspaceService:/app
     - media_data:/app/media
     - static_data:/app/static
    environment:
     - .env
    secrets:
     - db_name
     - db_user
     - db_password
     - django_secret_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: makerspace_nginx
    restart: always
    ports:
      - "8000:80"      # Host Port 8000 maps to Container Port 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    depends_on:
      - web
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge


volumes:
  postgres_data:
    driver: local
  media_data:
  static_data:

secrets:
  db_name:
    file: ./.secrets/db_name.txt
  db_user:
    file: ./.secrets/db_user.txt
  db_password:
    file: ./.secrets/db_password.txt
  django_secret_key:
    file: ./.secrets/django_secret_key.txt